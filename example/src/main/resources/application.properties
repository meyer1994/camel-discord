spring.application.name=camel-twitch-example

spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=

# HikariCP connection pool configuration
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.pool-name=PostgresHikariCP

logging.level.org.apache.camel=INFO

camel.component.openai.api-key=${OPENAI_API_KEY:}
camel.component.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
camel.component.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
camel.component.openai.lazy-start-producer=true