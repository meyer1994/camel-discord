<!doctype html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twitch Chat - Channel</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.7"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-base-300 text-base-content">
  <div class="navbar min-h-14 border-b border-base-300 bg-base-100 px-3 shadow-sm sm:px-4 lg:px-8">
    <div class="flex-1">
      <span class="text-lg font-bold sm:text-xl">Twitch Chat</span>
    </div>
    <div class="flex-none">
      <span class="badge badge-primary badge-outline" th:text="${channel}">channel</span>
    </div>
  </div>

  <main class="mx-auto max-w-7xl p-3 sm:p-4 lg:p-8">
    <div class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_24rem] lg:gap-6">
      <section class="grid items-start gap-4 sm:gap-6">
        <div class="card h-fit w-full self-start bg-base-100 shadow">
          <div class="card-body p-4 sm:p-6">
            <h2 class="card-title">Messages per second</h2>
            <p class="text-sm opacity-60">Last five minutes</p>
            <div id="messages-chart" class="h-64 w-full flex-none"></div>
          </div>
        </div>

        <div class="card h-fit w-full self-start bg-base-100 shadow">
          <div class="card-body p-4 sm:p-6">
            <h2 class="card-title">Chat velocity</h2>
            <p class="text-sm opacity-60">10-second rolling average</p>
            <div id="velocity-chart" class="h-64 w-full flex-none"></div>
          </div>
        </div>

        <div class="card h-fit w-full self-start bg-base-100 shadow">
          <div class="card-body p-4 sm:p-6">
            <div class="flex items-center justify-between">
              <h2 class="card-title">Chat leaderboard</h2>
              <span class="badge badge-primary badge-outline">Top 10</span>
            </div>
            <div id="leaderboard" class="divide-y divide-base-300"></div>
          </div>
        </div>
      </section>

      <aside class="card h-[28rem] min-h-0 bg-base-100 shadow sm:h-[32rem] lg:sticky lg:top-6 lg:h-[calc(100vh-7rem)] lg:min-h-[32rem]">
        <div class="card-body min-h-0 gap-0 p-0">
          <div class="flex items-center justify-between border-b border-base-300 px-4 py-3 sm:px-5 sm:py-4">
            <h2 class="card-title text-lg">Live chat</h2>
            <span class="badge badge-success badge-sm">LIVE</span>
          </div>
          <div id="messages"
               class="min-h-0 flex-1 space-y-0 overflow-y-auto break-words p-1.5 sm:p-2"
               hx-ext="sse"
               th:attr="sse-connect=@{/events(channel=${channel})}"
               sse-swap="chat"
               hx-swap="beforeend">
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script th:inline="javascript">
    const channel = /*[[${channel}]]*/ "channel";
    const chartMessages = createChart("messages-chart", "#570df8");
    const chartVelocity = createChart("velocity-chart", "#f000b8");

    function createChart(elementId, color) {
      const chart = echarts.init(document.getElementById(elementId));
      chart.setOption({
        animation: false,
        textStyle: { color: "#a6adbb" },
        grid: { top: 16, right: 16, bottom: 32, left: 42 },
        tooltip: { trigger: "axis" },
        xAxis: {
          type: "time",
          axisLabel: {
            hideOverlap: true,
            color: "#a6adbb",
            formatter: value => new Date(value).toLocaleTimeString([], {
              minute: "2-digit",
              second: "2-digit"
            })
          },
          axisLine: { lineStyle: { color: "#334155" } }
        },
        yAxis: {
          type: "value",
          minInterval: 1,
          axisLabel: { color: "#a6adbb" },
          splitLine: { lineStyle: { color: "#1e293b" } }
        },
        series: [{
          type: "line",
          smooth: true,
          showSymbol: false,
          areaStyle: { opacity: 0.15 },
          lineStyle: { width: 3 },
          itemStyle: { color },
          data: []
        }]
      });
      return chart;
    }

    async function refreshMessagesChart() {
      await refreshChart("/api/stats/messages", chartMessages);
    }

    async function refreshVelocityChart() {
      await refreshChart("/api/stats/velocity", chartVelocity);
    }

    async function refreshLeaderboard() {
      const response = await fetch(`/api/stats/chatters/top?channel=${encodeURIComponent(channel)}`);
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }

      const data = await response.json();
      const leaderboard = document.getElementById("leaderboard");
      leaderboard.replaceChildren();

      if (!data.items.length) {
        const empty = document.createElement("p");
        empty.className = "py-2 text-sm opacity-60";
        empty.textContent = "No data yet";
        leaderboard.append(empty);
        return;
      }

      data.items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "flex items-center gap-3 py-2 text-sm";

        const rank = document.createElement("span");
        rank.className = "w-5 text-center font-mono text-xs opacity-60";
        rank.textContent = index + 1;

        const user = document.createElement("span");
        user.className = "min-w-0 flex-1 truncate font-medium";
        user.textContent = item.user;

        const count = document.createElement("span");
        count.className = "font-mono text-xs opacity-70";
        count.textContent = Number(item.count).toLocaleString();

        row.append(rank, user, count);
        leaderboard.append(row);
      });
    }

    async function refreshChart(path, chart) {
      const response = await fetch(`${path}?channel=${encodeURIComponent(channel)}`);
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      const data = await response.json();
      chart.setOption({
        series: [{ data: data.points.map(point => [point.time, point.value]) }]
      });
    }

    function refreshAll() {
      refreshMessagesChart().catch(console.error);
      refreshVelocityChart().catch(console.error);
      refreshLeaderboard().catch(console.error);
    }

    refreshAll();
    setInterval(refreshAll, 5000);
    window.addEventListener("resize", () => {
      chartMessages.resize();
      chartVelocity.resize();
    });

    document.body.addEventListener("htmx:afterSettle", event => {
      const target = event.detail?.target || event.target;
      if (target?.id === "messages") {
        requestAnimationFrame(() => target.scrollTop = target.scrollHeight);
      }
    });
  </script>
</body>
</html>
