<!doctype html>
<html lang="en" data-theme="livechat" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${feed} ? |LIVE_CHAT // ${channel}| : 'LIVE_CHAT'">LIVE_CHAT</title>
  <meta name="description"
    th:content="${feed} ? |Live chat feed for ${channel}.| : 'Live chat streams for Twitch and Kick channels.'">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    [data-theme="livechat"] {
      color-scheme: dark;

      --color-base-100: oklch(15% 0 0);
      --color-base-200: oklch(20% 0 0);
      --color-base-300: oklch(25% 0 0);
      --color-base-content: oklch(92% 0 0);

      --color-primary: oklch(75% 0.09 300);
      --color-primary-content: oklch(20% 0 0);
      --color-secondary: oklch(78% 0.09 150);
      --color-secondary-content: oklch(15% 0 0);
      --color-accent: oklch(80% 0.09 250);
      --color-accent-content: oklch(15% 0 0);

      --color-neutral: oklch(40% 0 0);
      --color-neutral-content: oklch(92% 0 0);

      --color-info: oklch(80% 0.07 250);
      --color-info-content: oklch(15% 0 0);
      --color-success: oklch(80% 0.08 145);
      --color-success-content: oklch(20% 0 0);
      --color-warning: oklch(82% 0.07 80);
      --color-warning-content: oklch(15% 0 0);
      --color-error: oklch(72% 0.09 25);
      --color-error-content: oklch(20% 0 0);

      --radius-selector: 0.25rem;
      --radius-field: 0.5rem;
      --radius-box: 0.5rem;

      --size-selector: 0.25rem;
      --size-field: 0.25rem;

      --border: 1px;
      --depth: 0;
      --noise: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0"
    integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/ext/hx-sse.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css">
</head>

<body class="bg-base-100 flex flex-col gap-2 h-dvh overflow-hidden">
  <!-- navbar -->
  <div class="navbar bg-base-200 shadow flex justify-between">
    <!-- left: logo -->
    <a class="btn btn-ghost text-xl font-bold" href="/">LIVE_CHAT</a>

    <!-- right: channel info -->
    <div th:if="${feed}" class="flex items-center gap-4">
      <span class="badge badge-success">ONLINE</span>
      <span class="badge badge-outline" th:text="|CH: ${channel}|">CH: channel</span>
    </div>
  </div>

  <!-- main -->
  <main class="flex-1 min-h-0 w-full flex flex-col items-center">
    <!-- Landing state -->
    <section th:if="${!feed}" class="card bg-base-200 shadow my-auto">
      <div class="card-body items-center text-center">
        <h1 class="card-title text-2xl">Choose a channel</h1>

        <p class="text-base-content/70">Type a channel login. Suggestions are optional.</p>
        <form class="flex flex-col gap-3 w-full" method="get" th:action="@{/c}">
          <fieldset class="fieldset w-full text-left">
            <legend class="fieldset-legend">Channel</legend>
            <input class="input w-full" type="text" name="channel" list="channel-suggestions"
              placeholder="e.g. xqc" required autocomplete="off" spellcheck="false">

            <datalist id="channel-suggestions">
              <option th:each="channelOption : ${channels}" th:value="${channelOption}"></option>
            </datalist>
          </fieldset>

          <button class="btn btn-primary" type="submit">START_FEED</button>
        </form>
      </div>
    </section>

    <!-- Feed state -->
    <section th:if="${feed}" class="card bg-base-200 shadow w-full lg:w-156 flex flex-col flex-1 min-h-0">
      <div class="card-body flex flex-col gap-6 flex-1 min-h-0">
        <!-- header -->
        <div class="flex items-center justify-between gap-4">
          <div>
            <div class="text-xs text-base-content/50 uppercase tracking-wider">Realtime</div>
            <h1 class="text-lg font-bold">LIVE_MESSAGES</h1>
          </div>

          <!-- live chart via SSE -->
          <div id="score-chart" class="w-36 h-12" hx-ext="hx-sse" th:attr="'hx-sse:connect' = @{/chart/stream}"
            hx-target="#chart" hx-swap="beforeend">
            <table class="charts-css line hide-data">
              <tbody id="chart" hx-on="every 0.5s -> {
                while (this.children.length > 100) this.firstElementChild.remove();
              }">
              </tbody>
            </table>
          </div>
        </div>

        <!-- messages: unnamed SSE appends rows; score events are OOB by id -->
        <div id="messages" hx-ext="hx-sse" th:attr="'hx-sse:connect'=@{/c/{channel}/events(channel=${channel})}"
          hx-swap="beforeend scroll:bottom"
          class="flex flex-col gap-4 flex-1 overflow-y-auto [scrollbar-gutter:stable] overscroll-contain" hx-on="every 0.5s -> {
              while (this.children.length > 100) this.firstElementChild.remove();
            }">
        </div>
      </div>
    </section>
  </main>

  <div th:remove="all">
    <!-- Shared score badge: oob=false in new messages, oob=true for later updates -->
    <span th:fragment="score-badge(id, kind, score, oob)" th:id="${id}" aria-live="polite"
      th:attr="hx-swap-oob=${oob} ? 'outerHTML' : null"
      th:class="|badge badge-sm font-bold ${kind == 'good' ? 'badge-success' : 'badge-error'}|" th:title="${score == null
        ? (kind == 'good' ? 'Good similarity unavailable' : 'Bad similarity unavailable')
        : ((kind == 'good' ? 'Good similarity: ' : 'Bad similarity: ') + #numbers.formatDecimal(score, 0, 1))}"
      th:text="${score == null ? '' : #numbers.formatDecimal(score, 0, 1)}">-</span>

    <!-- Complete message fragment (empty scores, stable badge ids) -->
    <div
      th:fragment="chat-message(messageId, source, username, title, goodId, badId, goodScore, badScore, timeTitle, timeText, message)"
      th:id="${messageId}" th:title="${title}" class="flex flex-col gap-1 w-full">
      <div class="flex justify-between items-center text-xs w-full">
        <div class="flex items-center gap-2">
          <span class="badge badge-xs font-bold"
            th:classappend="${source == 'Twitch'} ? 'badge-primary' : 'badge-secondary'" th:title="|Source: ${source}|"
            th:text="${source}">source</span>
          <time class="text-base-content/50" th:title="${timeTitle}" th:text="${timeText}">00:00:00</time>
        </div>

        <div class="flex items-center gap-2">
          <th:block th:replace="~{::score-badge(${goodId}, 'good', ${goodScore}, false)}" />
          <th:block th:replace="~{::score-badge(${badId}, 'bad', ${badScore}, false)}" />
        </div>
      </div>

      <div class="w-full flex flex-col gap-1">
        <span class="font-semibold text-sm" th:text="|@${username}|"></span>
        <p class="text-sm break-words" th:text="${message}">Message</p>
      </div>
    </div>

    <!-- Chart fragment: just the rows, appended beforeend into the live tbody -->
    <th:block th:fragment="chart-fragment">
      <tr>
        <td
          th:style="'--start:' + ${good.start / 100} + ';--end:' + ${good.end / 100} + ';--color:var(--color-success)'">
          <span class="data" th:text="${good.end}">50</span>
        </td>
        <td th:style="'--start:' + ${bad.start / 100} + ';--end:' + ${bad.end / 100} + ';--color:var(--color-error)'">
          <span class="data" th:text="${bad.end}">50</span>
          <div class="tooltip">
            <p th:text="'Good: ' + ${#numbers.formatDecimal(good.end, 2, 2)}">Good: 50</p>
            <p th:text="'Bad: ' + ${#numbers.formatDecimal(bad.end, 2, 2)}">Bad: 50</p>
          </div>
        </td>
      </tr>
    </th:block>

    <!-- OOB score update: replaces badges by id -->
    <th:block th:fragment="chat-score-update(goodId, goodScore, badId, badScore)">
      <th:block th:replace="~{::score-badge(${goodId}, 'good', ${goodScore}, true)}" />
      <th:block th:replace="~{::score-badge(${badId}, 'bad', ${badScore}, true)}" />
    </th:block>
  </div>
</body>

</html>
