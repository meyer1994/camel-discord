<!doctype html>
<html lang="en" data-theme="livechat" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${feed} ? |LIVE_CHAT // ${channel}| : 'LIVE_CHAT'">LIVE_CHAT</title>
  <meta name="description"
    th:content="${feed} ? |Live chat feed for ${channel}.| : 'Live chat streams for Twitch and Kick channels.'">

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    [data-theme="livechat"] {
      color-scheme: dark;

      --color-base-100: oklch(15% 0 0);
      --color-base-200: oklch(20% 0 0);
      --color-base-300: oklch(25% 0 0);
      --color-base-content: oklch(92% 0 0);

      --color-primary: oklch(75% 0.09 300);
      --color-primary-content: oklch(20% 0 0);
      --color-secondary: oklch(78% 0.09 150);
      --color-secondary-content: oklch(15% 0 0);
      --color-accent: oklch(80% 0.09 250);
      --color-accent-content: oklch(15% 0 0);

      --color-neutral: oklch(40% 0 0);
      --color-neutral-content: oklch(92% 0 0);

      --color-info: oklch(80% 0.07 250);
      --color-info-content: oklch(15% 0 0);
      --color-success: oklch(80% 0.08 145);
      --color-success-content: oklch(20% 0 0);
      --color-warning: oklch(82% 0.07 80);
      --color-warning-content: oklch(15% 0 0);
      --color-error: oklch(72% 0.09 25);
      --color-error-content: oklch(20% 0 0);

      --radius-selector: 0.25rem;
      --radius-field: 0.5rem;
      --radius-box: 0.5rem;

      --size-selector: 0.25rem;
      --size-field: 0.25rem;

      --border: 1px;
      --depth: 0;
      --noise: 0;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0"
    integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0/dist/ext/hx-sse.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/charts.css/dist/charts.min.css">
</head>

<body class="bg-base-100 flex flex-col">
  <!-- navbar -->
  <div class="navbar bg-base-200 shadow flex justify-between">
    <!-- left: logo -->
    <a class="btn btn-ghost text-xl font-bold" href="/">LIVE_CHAT</a>

    <!-- right: channel info -->
    <div th:if="${feed}" class="flex items-center gap-4">
      <span class="badge badge-success">ONLINE</span>
      <span class="badge badge-outline" th:text="|CH: ${channel}|">CH: channel</span>
    </div>
  </div>

  <!-- main -->
  <main class="flex flex-col items-center w-full">
    <!-- Landing state -->
    <section th:if="${!feed}" class="card bg-base-200 shadow">
      <div class="card-body items-center text-center">
        <h1 class="card-title text-2xl">Choose a channel</h1>
        <p class="text-base-content/70">Select a configured channel to start the live chat feed.</p>
        <form class="flex flex-col w-full" method="get" th:action="@{/c}">
          <select class="select select-bordered flex-1" name="channel" required>
            <option value="" disabled selected>Select a channel</option>
            <option th:each="channelOption : ${channels}" th:value="${channelOption}" th:text="${channelOption}">channel
            </option>
          </select>
          <button class="btn btn-primary" type="submit">START_FEED</button>
        </form>
      </div>
    </section>

    <!-- Feed state -->
    <section th:if="${feed}" class="card bg-base-200 shadow w-156">
      <div class="card-body flex flex-col gap-6">
        <!-- header -->
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs text-base-content/50 uppercase tracking-wider">Realtime</div>
            <h1 class="text-lg font-bold">LIVE_MESSAGES</h1>
          </div>
          <div class="w-48 h-16">
            <table class="charts-css line hide-data" style="height: 100%;">
              <tbody>
                <tr><td style="--start:0.60; --end:0.55; --color:var(--color-success)"><span class="data">55</span></td><td style="--start:0.40; --end:0.45; --color:var(--color-error)"><span class="data">45</span></td></tr>
                <tr><td style="--start:0.55; --end:0.62; --color:var(--color-success)"><span class="data">62</span></td><td style="--start:0.45; --end:0.38; --color:var(--color-error)"><span class="data">38</span></td></tr>
                <tr><td style="--start:0.62; --end:0.48; --color:var(--color-success)"><span class="data">48</span></td><td style="--start:0.38; --end:0.52; --color:var(--color-error)"><span class="data">52</span></td></tr>
                <tr><td style="--start:0.48; --end:0.71; --color:var(--color-success)"><span class="data">71</span></td><td style="--start:0.52; --end:0.29; --color:var(--color-error)"><span class="data">29</span></td></tr>
                <tr><td style="--start:0.71; --end:0.65; --color:var(--color-success)"><span class="data">65</span></td><td style="--start:0.29; --end:0.35; --color:var(--color-error)"><span class="data">35</span></td></tr>
                <tr><td style="--start:0.65; --end:0.80; --color:var(--color-success)"><span class="data">80</span></td><td style="--start:0.35; --end:0.20; --color:var(--color-error)"><span class="data">20</span></td></tr>
                <tr><td style="--start:0.80; --end:0.74; --color:var(--color-success)"><span class="data">74</span></td><td style="--start:0.20; --end:0.26; --color:var(--color-error)"><span class="data">26</span></td></tr>
                <tr><td style="--start:0.74; --end:0.85; --color:var(--color-success)"><span class="data">85</span></td><td style="--start:0.26; --end:0.15; --color:var(--color-error)"><span class="data">15</span></td></tr>
                <tr><td style="--start:0.85; --end:0.63; --color:var(--color-success)"><span class="data">63</span></td><td style="--start:0.15; --end:0.37; --color:var(--color-error)"><span class="data">37</span></td></tr>
                <tr><td style="--start:0.63; --end:0.77; --color:var(--color-success)"><span class="data">77</span></td><td style="--start:0.37; --end:0.23; --color:var(--color-error)"><span class="data">23</span></td></tr>
                <tr><td style="--start:0.77; --end:0.58; --color:var(--color-success)"><span class="data">58</span></td><td style="--start:0.23; --end:0.42; --color:var(--color-error)"><span class="data">42</span></td></tr>
                <tr><td style="--start:0.58; --end:0.69; --color:var(--color-success)"><span class="data">69</span></td><td style="--start:0.42; --end:0.31; --color:var(--color-error)"><span class="data">31</span></td></tr>
                <tr><td style="--start:0.69; --end:0.82; --color:var(--color-success)"><span class="data">82</span></td><td style="--start:0.31; --end:0.18; --color:var(--color-error)"><span class="data">18</span></td></tr>
                <tr><td style="--start:0.82; --end:0.91; --color:var(--color-success)"><span class="data">91</span></td><td style="--start:0.18; --end:0.09; --color:var(--color-error)"><span class="data">9</span></td></tr>
                <tr><td style="--start:0.91; --end:0.72; --color:var(--color-success)"><span class="data">72</span></td><td style="--start:0.09; --end:0.28; --color:var(--color-error)"><span class="data">28</span></td></tr>
                <tr><td style="--start:0.72; --end:0.88; --color:var(--color-success)"><span class="data">88</span></td><td style="--start:0.28; --end:0.12; --color:var(--color-error)"><span class="data">12</span></td></tr>
                <tr><td style="--start:0.88; --end:0.79; --color:var(--color-success)"><span class="data">79</span></td><td style="--start:0.12; --end:0.21; --color:var(--color-error)"><span class="data">21</span></td></tr>
                <tr><td style="--start:0.79; --end:0.67; --color:var(--color-success)"><span class="data">67</span></td><td style="--start:0.21; --end:0.33; --color:var(--color-error)"><span class="data">33</span></td></tr>
                <tr><td style="--start:0.67; --end:0.75; --color:var(--color-success)"><span class="data">75</span></td><td style="--start:0.33; --end:0.25; --color:var(--color-error)"><span class="data">25</span></td></tr>
                <tr><td style="--start:0.75; --end:0.83; --color:var(--color-success)"><span class="data">83</span></td><td style="--start:0.25; --end:0.17; --color:var(--color-error)"><span class="data">17</span></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- messages -->
        <div class="overflow-y-auto max-h-[80vh]">
          <div id="messages" hx-ext="hx-sse" th:attr="'hx-sse:connect' = @{/c/{channel}/events(channel=${channel})}"
            hx-swap="beforeend scroll:bottom"
            class="flex flex-col gap-4">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Fragments are stripped during the initial page render. -->
  <div th:remove="all">
    <!-- Complete message fragment -->
    <div
      th:fragment="chat-message(messageId, source, username, title, goodId, badId, goodScore, badScore, timeTitle, timeText, message)"
      th:id="${messageId}" th:title="${title}" class="flex flex-col gap-1 w-full">
      <!-- header: source left, timestamp right -->
      <div class="flex justify-between items-center text-xs w-full">
        <!-- left: source and time -->
        <div class="flex items-center gap-2">
          <!-- source -->
          <span class="badge badge-xs font-bold" th:classappend="${source == 'Twitch'} ? 'badge-primary' : 'badge-secondary'"
            th:title="|Source: ${source}|" th:text="${source}">source</span>
          <!-- time -->
          <time class="text-base-content/50" th:title="${timeTitle}" th:text="${timeText}">00:00:00</time>
        </div>

        <!-- right: scores -->
        <div class="flex items-center gap-2">
          <span th:id="${goodId}" aria-live="polite" class="badge badge-sm badge-success font-bold"
            th:title="${goodScore == null ? 'Good similarity unavailable' : 'Good similarity: ' + #numbers.formatDecimal(goodScore, 0, 1)}"
            th:text="${goodScore == null ? '' : #numbers.formatDecimal(goodScore, 0, 1)}">-</span>
          <span th:id="${badId}" aria-live="polite" class="badge badge-sm badge-error font-bold"
            th:title="${badScore == null ? 'Bad similarity unavailable' : 'Bad similarity: ' + #numbers.formatDecimal(badScore, 0, 1)}"
            th:text="${badScore == null ? '' : #numbers.formatDecimal(badScore, 0, 1)}">-</span>
        </div>
      </div>

      <!-- body: username then message -->
      <div class="w-full flex flex-col gap-1">
        <span class="font-semibold text-sm" th:text="|@${username}|"></span>
        <p class="text-sm" th:text="${message}">Message</p>
      </div>
    </div>

    <!-- OOB score update fragment -->
    <th:block th:fragment="chat-score-update(goodId, goodScore, badId, badScore)">
      <span th:id="${goodId}" hx-swap-oob="outerHTML" aria-live="polite" class="badge badge-sm badge-success font-bold"
        th:title="|Good similarity: ${#numbers.formatDecimal(goodScore, 0, 1)}|" th:text="${#numbers.formatDecimal(goodScore, 0, 1)}">0</span>
      <span th:id="${badId}" hx-swap-oob="outerHTML" aria-live="polite" class="badge badge-sm badge-error font-bold"
        th:title="|Bad similarity: ${#numbers.formatDecimal(badScore, 0, 1)}|" th:text="${#numbers.formatDecimal(badScore, 0, 1)}">0</span>
    </th:block>
  </div>
</body>

</html>
