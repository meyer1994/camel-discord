<!doctype html>
<html lang="en" data-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|Chatter - ${chatter}|">Chatter</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.7"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js"></script>
</head>

<body class="min-h-screen overflow-x-hidden bg-base-300 text-base-content">
  <div class="navbar min-h-14 border-b border-base-300 bg-base-100 px-3 shadow-sm sm:px-4 lg:px-8">
    <div class="flex-1"><span class="text-lg font-bold sm:text-xl">Chatter Observatory</span></div>
    <div class="flex-none"><span class="badge badge-primary badge-outline" th:text="${chatter}">chatter</span></div>
  </div>

  <main class="mx-auto max-w-[1600px] p-3 sm:p-4 lg:p-6">
    <div class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_24rem] lg:gap-6">
      <section class="grid min-w-0 gap-4 sm:grid-cols-2">
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Messages per minute</h2>
            <p class="text-xs opacity-60">Last five minutes</p>
            <div id="timeline-chart" class="h-64 w-full"></div>
          </div>
        </div>
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Messages by channel</h2>
            <div id="channels-chart" class="h-64 w-full"></div>
          </div>
        </div>
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Average message length by channel</h2>
            <div id="channel-lengths-chart" class="h-64 w-full"></div>
          </div>
        </div>
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Message length</h2>
            <div id="lengths-chart" class="h-64 w-full"></div>
          </div>
        </div>
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Subscription tiers</h2>
            <div id="tiers-chart" class="h-64 w-full"></div>
          </div>
        </div>
        <div class="card min-w-0 bg-base-100 shadow">
          <div class="card-body p-4">
            <h2 class="card-title text-base">Activity by hour</h2>
            <div id="activity-chart" class="h-64 w-full"></div>
          </div>
        </div>
      </section>

      <aside
        class="card h-[28rem] min-h-0 bg-base-100 shadow sm:h-[32rem] lg:sticky lg:top-6 lg:h-[calc(100vh-5.5rem)] lg:min-h-[32rem]">
        <div class="card-body min-h-0 gap-0 p-0">
          <div class="flex items-center justify-between border-b border-base-300 px-4 py-3 sm:px-5 sm:py-4">
            <h2 class="card-title text-lg">Live messages</h2><span class="badge badge-success badge-sm">LIVE</span>
          </div>
          <div class="min-h-0 flex-1" hx-ext="sse" th:attr="sse-connect=@{/events/chatter(chatter=${chatter})}">
            <div id="messages" class="h-full space-y-0 overflow-y-auto break-words p-1.5 sm:p-2" sse-swap="chat"
              hx-swap="beforeend"></div>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script th:inline="javascript">
    const chatter = /*[[${chatter}]]*/ "chatter";
    const charts = [];

    function initChart(id, option) {
      const chart = echarts.init(document.getElementById(id));
      chart.setOption({ animation: false, textStyle: { color: "#a6adbb" }, ...option });
      charts.push(chart);
      return chart;
    }

    const timelineChart = initChart("timeline-chart", {
      grid: { top: 18, right: 16, bottom: 34, left: 44 }, tooltip: { trigger: "axis" },
      xAxis: { type: "time", axisLabel: { hideOverlap: true, formatter: value => new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) } },
      yAxis: { type: "value", minInterval: 1 }, series: [{ type: "line", smooth: true, showSymbol: false, itemStyle: { color: "#570df8" }, areaStyle: { opacity: 0.15 }, data: [] }]
    });
    const channelsChart = initChart("channels-chart", { grid: { top: 16, right: 16, bottom: 24, left: 72 }, xAxis: { type: "value", minInterval: 1 }, yAxis: { type: "category", data: [] }, series: [{ type: "bar", itemStyle: { color: "#37cdbe" }, data: [] }] });
    const channelLengthsChart = initChart("channel-lengths-chart", { grid: { top: 16, right: 16, bottom: 24, left: 72 }, xAxis: { type: "value", minInterval: 1 }, yAxis: { type: "category", data: [] }, series: [{ type: "bar", itemStyle: { color: "#fbbd23" }, data: [] }] });
    const lengthsChart = initChart("lengths-chart", { grid: { top: 16, right: 16, bottom: 24, left: 44 }, xAxis: { type: "category", data: [] }, yAxis: { type: "value", minInterval: 1 }, series: [{ type: "bar", itemStyle: { color: "#fbbd23" }, data: [] }] });
    const tiersChart = initChart("tiers-chart", { tooltip: { trigger: "item" }, legend: { bottom: 0 }, series: [{ type: "pie", radius: ["35%", "68%"], data: [] }] });
    const activityChart = initChart("activity-chart", { grid: { top: 16, right: 16, bottom: 24, left: 44 }, xAxis: { type: "category", data: [] }, yAxis: { type: "value", minInterval: 1 }, series: [{ type: "bar", itemStyle: { color: "#3abff8" }, data: [] }] });

    async function fetchStats(path) {
      const response = await fetch(`${path}?chatter=${encodeURIComponent(chatter)}`);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    async function refreshChannels() {
      const items = await fetchStats("/api/chatters/channels");
      const channels = [...items].reverse();
      channelsChart.setOption({ yAxis: { data: channels.map(item => item.channel) }, series: [{ data: channels.map(item => item.messages ?? 0) }] });
      channelLengthsChart.setOption({ yAxis: { data: channels.map(item => item.channel) }, series: [{ data: channels.map(item => Number(item.average_message_length ?? item.averageMessageLength ?? 0)) }] });
    }

    async function refreshTimeline() {
      const data = await fetchStats("/api/chatters/timeline");
      timelineChart.setOption({ series: [{ data: data.map(point => [point.time, point.value]) }] });
    }

    async function refreshLengths() {
      const data = await fetchStats("/api/chatters/lengths");
      lengthsChart.setOption({ xAxis: { data: data.map(item => item.bucket) }, series: [{ data: data.map(item => item.count) }] });
    }

    async function refreshTiers() {
      const data = await fetchStats("/api/chatters/tiers");
      tiersChart.setOption({ series: [{ data: data.map(item => ({ name: `Tier ${item.tier ?? "Unknown"}`, value: item.count })) }] });
    }

    async function refreshActivity() {
      const data = await fetchStats("/api/chatters/activity/hour");
      activityChart.setOption({ xAxis: { data: data.map(item => item.hour) }, series: [{ data: data.map(item => item.count) }] });
    }

    function refreshAll() {
      refreshChannels().catch(console.error); refreshTimeline().catch(console.error); refreshLengths().catch(console.error); refreshTiers().catch(console.error); refreshActivity().catch(console.error);
    }

    refreshAll();
    setInterval(refreshAll, 5000);
    window.addEventListener("resize", () => charts.forEach(chart => chart.resize()));
    document.body.addEventListener("htmx:afterSettle", event => { const target = event.detail?.target || event.target; if (target?.id === "messages") requestAnimationFrame(() => target.scrollTop = target.scrollHeight); });
  </script>
</body>

</html>
